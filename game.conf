# game.conf: what tools/native-build.sh needs to know about this game. No game data in here.
TITLE="Paper Mario: Color Splash"
NAME=colorsplash
RPX=main.rpx
TESTED_TITLE_ID=000500001F600B00
TESTED_REGION="Europe"
RECOMP_ARGS="--any-rpx --all"
# A hand-written jump table (0x02053650): every slot is an entry of its own (addresses only).
RECOMP_ENTRIES_FILE=port/colorsplash-extra-entries.txt
BUILD_MINUTES=4-10
DISK_GB=2
# Battle cards and the map are on the GamePad: left stick click switches to its picture, mouse / right stick = touch.
START_ENV="CAFE_TOUCH_UI=1"
# The country/language list title (0005001B-1005C000) of your own Wii U.
SYS_TITLES=1005c000
SYS_NOTE_DE="WICHTIG: Color Splash braucht die Laender-/Sprachliste deiner eigenen Wii U (Titel 0005001B-1005C000, -SysDir / --sys)."
SYS_NOTE_EN="IMPORTANT: Color Splash needs the country/language list of your own Wii U (title 0005001B-1005C000, -SysDir / --sys)."
